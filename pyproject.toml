[project]
name = "comparelists"
version = "0.1.0"
description = "Local name-matching: find names from a source-of-truth list inside a second list, using the local Laya decision model."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "laya>=0.3.20",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "gradio>=4.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
comparelists = "comparelists.cli:main"
comparelists-web = "comparelists.webapp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comparelists"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
